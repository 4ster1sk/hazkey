name: Build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: ubuntu-22.04
            arch: x86_64
            distro_family: ubuntu
            swift_url: https://download.swift.org/swift-6.2-release/ubuntu2204/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu22.04.tar.gz
            static_protobuf: false
            package_deb: true
          - runner: ubuntu-24.04
            label: ubuntu-24.04
            arch: x86_64
            distro_family: ubuntu
            swift_url: https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz
            static_protobuf: false
            package_deb: true
          - runner: ubuntu-latest
            container: debian:bookworm
            label: debian-12
            arch: x86_64
            distro_family: debian
            swift_url: https://download.swift.org/swift-6.2-release/debian12/swift-6.2-RELEASE/swift-6.2-RELEASE-debian12.tar.gz
            static_protobuf: false
            package_deb: true
          - runner: ubuntu-24.04-arm
            label: ubuntu-24.04
            arch: aarch64
            distro_family: ubuntu
            swift_url: https://download.swift.org/swift-6.2-release/ubuntu2404-aarch64/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04-aarch64.tar.gz
            static_protobuf: false
            package_deb: false
          - runner: ubuntu-22.04
            label: ubuntu-22.04-static_protobuf
            arch: x86_64
            distro_family: ubuntu
            swift_url: https://download.swift.org/swift-6.2-release/ubuntu2204/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu22.04.tar.gz
            static_protobuf: true
            package_deb: false
          - runner: ubuntu-24.04-arm
            label: ubuntu-24.04-static_protobuf
            arch: aarch64
            distro_family: ubuntu
            swift_url: https://download.swift.org/swift-6.2-release/ubuntu2404-aarch64/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04-aarch64.tar.gz
            static_protobuf: true
            package_deb: false
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Install git for checkout Debian container
        if: matrix.distro_family == 'debian'
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends ca-certificates git wget

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Swift Environment
        id: cache-swift
        uses: actions/cache@v5
        with:
          path: swift
          key: ${{ matrix.label }}-${{ matrix.arch }}-swift-6.2-RELEASE

      - name: Install Swift Environment
        if: steps.cache-swift.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/swift"

          swift_url="${{ matrix.swift_url }}"
          swift_archive="$(basename "$swift_url")"

          wget "$swift_url"
          tar xf "$swift_archive" --strip-components=1 -C "$GITHUB_WORKSPACE/swift"

      - name: Add Swift to PATH
        run: |
          echo "$GITHUB_WORKSPACE/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.1.x"

      - name: Install Dependencies (Ubuntu)
        if: matrix.distro_family == 'ubuntu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends wget gnupg2 \
            build-essential gettext fakeroot dpkg-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            ninja-build qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6widgets6 libqt6gui6 qt6-l10n-tools libglx-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Install Dependencies (Debian)
        if: matrix.distro_family == 'debian'
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends ca-certificates bash wget \
            build-essential gettext fakeroot dpkg-dev file \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            ninja-build qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6widgets6 libqt6gui6 qt6-l10n-tools \
            libglx-dev libgl1-mesa-dev libxkbcommon-dev \
            protobuf-compiler libprotobuf-dev \
            libvulkan-dev glslc mesa-vulkan-drivers \
            libncurses6 libtinfo6 libcurl4 

      - name: Install Dependencies protobuf Ubuntu
        if: matrix.distro_family == 'ubuntu' && !matrix.static_protobuf
        run: |
          sudo apt-get install -y protobuf-compiler libprotoc-dev

      - name: Vulkan Dependencies (Ubuntu 22.04)
        if: matrix.distro_family == 'ubuntu' && matrix.runner == 'ubuntu-22.04'
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers vulkan-sdk

      - name: Vulkan Dependencies (Ubuntu 24.04+)
        if: matrix.distro_family == 'ubuntu' && (matrix.runner == 'ubuntu-24.04' || matrix.runner == 'ubuntu-24.04-arm')
        run: |
          sudo apt-get install -y libvulkan-dev glslc

      - name: Create Directories
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/local_deps"
          mkdir -p "$GITHUB_WORKSPACE/workdir"
          mkdir -p "$GITHUB_WORKSPACE/packages"

      - name: Cache C++ Dependencies
        if: matrix.static_protobuf
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: local_deps
          key: ${{ matrix.runner }}-${{ matrix.arch }}-protobuf-21-12-v1

      - name: Build and Install Protobuf
        if: matrix.static_protobuf && steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/protobuf"

          git clone \
            --branch v21.12 \
            --depth 1 \
            https://github.com/protocolbuffers/protobuf.git \
            "$GITHUB_WORKSPACE/protobuf"

          cmake \
            -S "$GITHUB_WORKSPACE/protobuf" \
            -B "$GITHUB_WORKSPACE/protobuf/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -Dprotobuf_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/local_deps"

          cmake --build "$GITHUB_WORKSPACE/protobuf/build" --parallel "$(nproc)"
          cmake --install "$GITHUB_WORKSPACE/protobuf/build"

      - name: Add local_deps to PATH
        if: matrix.static_protobuf
        run: |
          echo "$GITHUB_WORKSPACE/local_deps/bin" >> "$GITHUB_PATH"

      - name: Build hazkey-settings
        run: |
          set -eux

          test -d "$GITHUB_WORKSPACE/hazkey-settings"
          test -f "$GITHUB_WORKSPACE/hazkey-settings/CMakeLists.txt"

          ui_file="$(find "$GITHUB_WORKSPACE/hazkey-settings" -maxdepth 5 -name 'mainwindow.ui' -print -quit)"
          if [ -n "$ui_file" ]; then
            sed -i "s/Qt::Orientation::/Qt::/g" "$ui_file"
          else
            echo "mainwindow.ui not found, skipping sed"
          fi

          cmake \
            -S "$GITHUB_WORKSPACE/hazkey-settings" \
            -B "$GITHUB_WORKSPACE/hazkey-settings/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/local_deps/include" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/local_deps" \
            -DProtobuf_USE_STATIC_LIBS=${{ matrix.static_protobuf }} \
            -G Ninja

          cmake --build "$GITHUB_WORKSPACE/hazkey-settings/build" --parallel "$(nproc)"
          DESTDIR="$GITHUB_WORKSPACE/workdir" cmake --install "$GITHUB_WORKSPACE/hazkey-settings/build"

      - name: Build fcitx5-hazkey
        run: |
          set -eux

          test -d "$GITHUB_WORKSPACE/fcitx5-hazkey"
          test -f "$GITHUB_WORKSPACE/fcitx5-hazkey/CMakeLists.txt"

          cmake \
            -S "$GITHUB_WORKSPACE/fcitx5-hazkey" \
            -B "$GITHUB_WORKSPACE/fcitx5-hazkey/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/local_deps" \
            -DProtobuf_USE_STATIC_LIBS=${{ matrix.static_protobuf }} \
            -G Ninja

          cmake --build "$GITHUB_WORKSPACE/fcitx5-hazkey/build" --parallel "$(nproc)"
          DESTDIR="$GITHUB_WORKSPACE/workdir" cmake --install "$GITHUB_WORKSPACE/fcitx5-hazkey/build"

      - name: Build hazkey-server
        run: |
          set -eux

          test -d "$GITHUB_WORKSPACE/hazkey-server"
          test -f "$GITHUB_WORKSPACE/hazkey-server/CMakeLists.txt"

          cmake \
            -S "$GITHUB_WORKSPACE/hazkey-server" \
            -B "$GITHUB_WORKSPACE/hazkey-server/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DHAZKEY_SERVER_SWIFT_LTO_MODE=full \
            -G Ninja

          cmake --build "$GITHUB_WORKSPACE/hazkey-server/build" --parallel "$(nproc)"
          DESTDIR="$GITHUB_WORKSPACE/workdir" cmake --install "$GITHUB_WORKSPACE/hazkey-server/build"

      - name: Strip binaries
        run: |
          set -eux

          find "$GITHUB_WORKSPACE/workdir/usr" -type f -print0 | xargs -0r file -i | awk -F: '/application\/(x-pie-executable|x-sharedlib)/ { print $1 }' | xargs -r strip

      - name: Read project version
        id: project_version
        run: |
          set -eux
          version="$(grep -oP 'project\s*\(\s*hazkey\s+VERSION\s+\K[0-9]+(\.[0-9]+)*' "$GITHUB_WORKSPACE/CMakeLists.txt" || true)"
          if [[ -z "$version" ]]; then
            echo "Failed to extract version from CMakeLists.txt" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create deb package
        if: matrix.package_deb
        run: |
          set -eux

          "$GITHUB_WORKSPACE/.github/scripts/create_deb.sh" \
            "$GITHUB_WORKSPACE/workdir" \
            "$GITHUB_WORKSPACE/packages" \
            "${{ steps.project_version.outputs.version }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.label }}" \
            "${{ github.ref }}" \
            "${{ github.sha }}"

      - name: Verify deb package
        if: matrix.package_deb
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            x86_64) deb_arch=amd64 ;;
            aarch64) deb_arch=arm64 ;;
            *)
              echo "unsupported arch for verification: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac

          deb_file="$(find "$GITHUB_WORKSPACE/packages" -maxdepth 1 -type f -name "fcitx5-hazkey_*-${{ matrix.label }}_${deb_arch}.deb" -print -quit)"

          if [[ -z "$deb_file" ]]; then
            echo "deb package not found for label=${{ matrix.label }} arch=${{ matrix.arch }}" >&2
            exit 1
          fi

          dpkg-deb -I "$deb_file"
          dpkg-deb -c "$deb_file" | grep -E 'usr/lib/.*/(fcitx5|hazkey)|usr/share/fcitx5|usr/share/hazkey'

          if [[ "${{ matrix.distro_family }}" == "debian" ]]; then
            depends="$(dpkg-deb -f "$deb_file" Depends)"

            if grep -q 't64' <<<"$depends"; then
              echo "Debian package Depends must not use Ubuntu t64 library names" >&2
              echo "$depends" >&2
              exit 1
            fi

            apt-get update -qq
            apt-get install -y --no-install-recommends -s "$deb_file"
          fi

      - name: Create tar.gz archive
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/workdir"

          tar -czvf "$GITHUB_WORKSPACE/packages/fcitx5-hazkey-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz" ./usr

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fcitx5-hazkey-${{ matrix.label }}-${{ matrix.arch }}
          path: packages/*